<!DOCTYPE html>
<html>
  <head>
    <title>Box Space</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="final.js" defer></script>
    <link rel="stylesheet" href="final.css">
  </head>
  <body>
    <a-scene>
      <!-- Sky with ocean blue color -->
      <a-sky color="#1E90FF"></a-sky>

      <!-- Translucent Walls with Ocean Blue Background -->
      <a-box position="0 5 0" depth="50" height="20" width="50" color="#1E90FF" opacity="0.3" side="double"></a-box>

      <!-- Whale Model 1 (Starts Outside the Box) -->
      <a-entity 
        id="whale"
        position="-40 25 -30" 
        rotation="0 90 0" 
        obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" 
        material="color: #708090;">
      </a-entity>

      <!-- Baby Whale (1/4 the size, next to the original whale) -->
      <a-entity 
        id="baby-whale"
        position="-42 24.5 -30" 
        rotation="0 90 0" 
        scale="0.25 0.25 0.25" 
        obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" 
        material="color: #708090;">
      </a-entity>

      <!-- Whale Model 2 (Starts Outside the Box, Same Direction as Baby Whale) -->
      <a-entity 
        id="whale2"
        position="40 -15 30" 
        rotation="0 90 0" 
        obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" 
        material="color: #708090;">
      </a-entity>

      <!-- Additional Whales -->
      <a-entity id="whale3" position="100 75 -100" scale="3.5 3.5 3.5" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity>
      <!-- <a-entity id="whale4" position="-10 300 -5" scale="1.2 1.2 1.2" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity> -->
      <a-entity id="whale5" position="10 40 -15" scale="1.8 1.8 1.8" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity>
      <a-entity id="whale6" position="-500 -200 -200" scale="1.1 1.1 1.1" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity> -->
      <a-entity id="whale7" position="-150 -75 100" scale="2 2 2" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity> -->
      <a-entity id="whale8" position="-200 -300 -150" scale="1.3 1.3 1.3" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity>
      <a-entity id="whale9" position="50 -35 -12" scale="1.7 1.7 1.7" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity>
      <!-- <a-entity id="whale10" position="-15 -28 -18" scale="1.4 1.4 1.4" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity>
      <a-entity id="whale11" position="10 -32 -25" scale="1.6 1.6 1.6" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity>
      <a-entity id="whale12" position="-10 -40 -22" scale="1.9 1.9 1.9" rotation="0 90 0" obj-model="obj: url(Whale.obj); mtl: url(Whale.mtl);" material="color: #708090;"></a-entity> --> --> --> --> -->

      <!-- Ambient lighting -->
      <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
    </a-scene>
  </body>
</html>
