<!DOCTYPE html>
<html>
  <head>
    <title>Unreal Summer World</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="lab11.js"></script>
    <link rel="stylesheet" href="lab11.css">
  </head>
  <body>
    <a-scene>
      <!-- Sky with blue color -->
      <a-sky color="#87CEEB"></a-sky>

      <!-- Ground with PNG texture -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" src="sand1-albedo.png" repeat="5 5"></a-plane>

      <!-- Beach Umbrella -->
      <a-cone position="3 2 -3" radius-bottom="1.5" height="1" color="#FF6347"></a-cone>
      <a-cylinder position="3 0.5 -3" radius="0.05" height="2" color="#8B4513"></a-cylinder>

      <!-- Ice Cream Cone -->
      <a-cone position="-2 0.5 -3" radius-bottom="0.3" height="1" color="#D2B48C" rotation="180 0 0"></a-cone>
      <a-sphere position="-2 1.2 -3" radius="0.4" color="#FF69B4"></a-sphere>
      <a-sphere position="-2 1.6 -3" radius="0.3" color="#FFD700"></a-sphere>

      <!-- Clouds distributed in 360 degrees -->
      <a-entity>
        <a-sphere position="-5 6 -10" radius="1.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-4.5 6.5 -10" radius="1" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-5.5 6.5 -10" radius="1" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>
      <a-entity>
        <a-sphere position="5 6 -10" radius="1.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="4.5 6.5 -10" radius="1" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="5.5 6.5 -10" radius="1" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>
      <a-entity>
        <a-sphere position="0 7 -15" radius="2" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-0.5 7.5 -15" radius="1.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="0.5 7.5 -15" radius="1.5" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>
      <a-entity>
        <a-sphere position="-7 8 -20" radius="2.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-6.5 8.5 -20" radius="2" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-7.5 8.5 -20" radius="2" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>
      <a-entity>
        <a-sphere position="7 8 -20" radius="2.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="6.5 8.5 -20" radius="2" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="7.5 8.5 -20" radius="2" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>
      <a-entity>
        <a-sphere position="-10 9 -25" radius="3" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-9.5 9.5 -25" radius="2.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="-10.5 9.5 -25" radius="2.5" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>
      <a-entity>
        <a-sphere position="10 9 -25" radius="3" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="9.5 9.5 -25" radius="2.5" color="#FFFFFF" opacity="0.9"></a-sphere>
        <a-sphere position="10.5 9.5 -25" radius="2.5" color="#FFFFFF" opacity="0.9"></a-sphere>
      </a-entity>

    </a-scene>


  </body>
</html>
